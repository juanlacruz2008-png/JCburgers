<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital - Restaurante</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 text-white min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Encabezado -->
    <header class="bg-gradient-to-r from-amber-600/20 via-gray-800 to-gray-900 p-6 md:p-8 rounded-3xl border border-amber-500/30 shadow-2xl flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="text-center md:text-left">
        <span class="bg-amber-500/10 text-amber-400 text-xs font-extrabold px-3 py-1 rounded-full border border-amber-500/20 uppercase tracking-widest">
          <i class="fa-solid fa-fire mr-1"></i> Pedidos Online
        </span>
        <h1 class="text-3xl md:text-4xl font-extrabold text-white mt-2">Restaurante Gourmet</h1>
        <p class="text-gray-400 text-sm mt-1">Elige tus platillos favoritos y recíbelos al instante</p>
      </div>
      <!-- Selector de Moneda -->
      <div class="bg-gray-900/80 p-3 rounded-2xl border border-gray-700 flex items-center gap-3">
        <span class="text-xs text-gray-400 font-bold uppercase"><i class="fa-solid fa-coins text-amber-400 mr-1"></i> Moneda:</span>
        <select id="currency-select" onchange="changeCurrency()" class="bg-gray-800 border border-gray-700 text-amber-400 font-bold text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-amber-500">
          <option value="USD">Dólares ($ USD)</option>
          <option value="COP">Pesos ($ COP)</option>
          <option value="VES">Bolívares (Bs VES)</option>
        </select>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Catálogo -->
      <section class="lg:col-span-2 space-y-4">
        <h2 class="text-xl font-bold border-b border-gray-800 pb-2 flex items-center gap-2 text-amber-400">
          <i class="fa-solid fa-utensils"></i> Nuestro Menú
        </h2>
        <div id="catalog-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </section>

      <!-- Carrito -->
      <aside class="bg-gray-900/90 backdrop-blur-md p-6 rounded-3xl border border-gray-800 shadow-2xl h-fit sticky top-6 space-y-4">
        <h2 class="text-xl font-bold border-b border-gray-800 pb-3 flex items-center gap-2 text-emerald-400">
          <i class="fa-solid fa-bag-shopping"></i> Tu Carrito
        </h2>
        
        <div id="cart-items" class="space-y-3 max-h-64 overflow-y-auto pr-1">
          <p class="text-gray-500 text-sm italic text-center py-6">Tu carrito está vacío</p>
        </div>

        <div class="border-t border-gray-800 pt-4 space-y-4">
          <div class="flex justify-between items-center font-bold text-xl">
            <span class="text-gray-400">Total:</span>
            <span id="cart-total" class="text-emerald-400">$0.00</span>
          </div>

          <div class="space-y-2">
            <label class="block text-xs text-gray-400 font-semibold">Mesa o Nombre:</label>
            <input type="text" id="client-info" placeholder="Ej: Mesa 5 / Carlos" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500 transition">
          </div>

          <button onclick="sendOrderToAPI()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2 transform active:scale-95">
            <i class="fa-solid fa-paper-plane"></i> Enviar Pedido a Caja
          </button>
        </div>
      </aside>

    </div>
  </div>

  <script>
    const apiChannel = new BroadcastChannel('restaurante_api_channel');

    const defaultMenu = [
      { id: 1, name: "Hamburguesa Doble Carne", price: 8.50, category: "Comidas", stock: 25 },
      { id: 2, name: "Pizza Pepperoni Especial", price: 12.00, category: "Comidas", stock: 15 },
      { id: 3, name: "Papas Fritas Gourmet", price: 3.50, category: "Comidas", stock: 30 },
      { id: 4, name: "Refresco Cola 500ml", price: 1.50, category: "Bebidas", stock: 50 }
    ];

    let inventory = [];
    let cart = [];
    let currentCurrency = 'USD';
    const rates = { USD: 1, COP: 4100, VES: 36.5 };

    function loadInventory() {
      const stored = localStorage.getItem('rest_inventory');
      inventory = stored ? JSON.parse(stored) : defaultMenu;
      renderCatalog();
    }

    function formatPrice(usdPrice) {
      if (currentCurrency === 'COP') return `$${(usdPrice * rates.COP).toLocaleString()} COP`;
      if (currentCurrency === 'VES') return `Bs ${(usdPrice * rates.VES).toFixed(2)} VES`; return `$${usdPrice.toFixed(2)} USD`;
    }

    function changeCurrency() {
      currentCurrency = document.getElementById('currency-select').value;
      renderCatalog();
      renderCart();
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-container');
      container.innerHTML = inventory.map(item => `
        <div class="bg-gray-900/80 backdrop-blur-sm p-5 rounded-2xl border border-gray-800 hover:border-amber-500/50 transition duration-300 flex flex-col justify-between animate-fade shadow-lg">
          <div>
            <span class="text-[10px] uppercase font-bold tracking-wider bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-full">${item.category || 'General'}</span>
            <h3 class="font-bold text-lg mt-3 text-white">${item.name}</h3>
            <p class="text-emerald-400 font-extrabold text-lg mt-1">${formatPrice(item.price)}</p>
            <p class="text-xs ${item.stock > 5 ? 'text-gray-400' : 'text-red-400'} mt-1">Disponibles: ${item.stock}</p>
          </div>
          <button onclick="addToCart('${item.id}')" class="mt-5 w-full bg-amber-500 hover:bg-amber-400 text-gray-950 font-extrabold py-2.5 rounded-xl transition duration-200 shadow-md transform active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-cart-plus"></i> Agregar
          </button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const item = inventory.find(i => String(i.id) === String(id));
      if (!item) return;

      const existing = cart.find(c => String(c.id) === String(id));
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ id: item.id, name: item.name, price: Number(item.price), qty: 1 });
      }
      renderCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(c => String(c.id) === String(id));
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(c => String(c.id) !== String(id));
      renderCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(c => String(c.id) !== String(id));
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-sm italic text-center py-6">Tu carrito está vacío</p>`;
        document.getElementById('cart-total').innerText = formatPrice(0);
        return;
      }

      let totalUSD = 0;
      container.innerHTML = cart.map(item => {
        const subUSD = item.price * item.qty;
        totalUSD += subUSD;
        return `
          <div class="flex justify-between items-center text-sm bg-gray-950/60 p-3 rounded-xl border border-gray-800/80 animate-fade">
            <div class="flex-1 pr-2">
              <p class="font-bold text-white">${item.name}</p>
              <p class="text-xs text-emerald-400 font-semibold">${formatPrice(item.price)} c/u</p>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex items-center bg-gray-900 rounded-lg border border-gray-700">
                <button onclick="changeQty('${item.id}', -1)" class="px-2 py-1 text-gray-300 hover:text-white font-bold text-xs">-</button>
                <span class="px-2 text-xs font-bold text-amber-400">${item.qty}</span>
                <button onclick="changeQty('${item.id}', 1)" class="px-2 py-1 text-gray-300 hover:text-white font-bold text-xs">+</button>
              </div>
              <span class="font-bold text-white text-xs min-w-[60px] text-right">${formatPrice(subUSD)}</span>
              <button onclick="removeFromCart('${item.id}')" class="text-red-400 hover:text-red-300 font-bold px-1.5 text-sm">✕</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total').innerText = formatPrice(totalUSD);
    }

    function sendOrderToAPI() {
      const info = document.getElementById('client-info').value.trim();
      if (cart.length === 0) return alert('El carrito está vacío');
      if (!info) return alert('Ingresa tu mesa o nombre');

      const totalUSD = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const newOrder = {
        id: Date.now(),
        client: info,
        currency: currentCurrency,
        items: [...cart],
        total: totalUSD,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        status: 'Pendiente'
      };

      // Puente dual (BroadcastChannel + Storage)
      apiChannel.postMessage({ type: 'NEW_ORDER', payload: newOrder });
      localStorage.setItem('rest_last_order_trigger', JSON.stringify({ timestamp: Date.now(), payload: newOrder }));

      alert('¡Pedido enviado con éxito a la caja!');
      cart = [];
      document.getElementById('client-info').value = '';
      renderCart();
    }

    // Escuchar actualizaciones del Admin
    apiChannel.onmessage = (event) => {
      if (event.data.type === 'INVENTORY_UPDATED') {
        inventory = event.data.payload;
        renderCatalog();
      }
    };

    window.addEventListener('storage', (event) => {
      if (event.key === 'rest_inventory_sync') {
        try {
          const data = JSON.parse(event.newValue);
          if (data && data.payload) {
            inventory = data.payload;
            renderCatalog();
          }
        } catch (e) {}
      }
    });

    loadInventory();
  </script>
</body>
</html>
