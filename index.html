<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Restaurante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-gray-950 text-white min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Encabezado -->
        <header class="bg-gradient-to-r from-amber-600/20 via-gray-800 to-gray-900 p-6 rounded-2xl border border-amber-500/30 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <span class="bg-amber-500/10 text-amber-400 font-semibold px-3 py-1 rounded-full text-xs uppercase tracking-wider border border-amber-500/20">
                    <i class="fa-solid fa-fire mr-1"></i> Pedidos Online
                </span>
                <h1 class="text-3xl md:text-4xl font-extrabold mt-2 text-white tracking-tight">Restaurante Gourmet</h1>
                <p class="text-gray-400 text-sm mt-1">Elige tus platillos favoritos y recíbelos al instante</p>
            </div>
            
            <!-- Selector de Moneda -->
            <div class="bg-gray-900/80 p-3 rounded-2xl border border-gray-700/60 flex items-center gap-3">
                <span class="text-xs text-gray-400 font-bold uppercase tracking-wider"><i class="fa-solid fa-coins text-amber-400 mr-1"></i> Moneda:</span>
                <select id="currency-select" onchange="changeCurrency()" class="bg-gray-800 text-amber-400 font-bold text-sm px-3 py-1.5 rounded-xl border border-gray-600 focus:outline-none focus:border-amber-500">
                    <option value="USD">Dólares ($ USD)</option>
                    <option value="COP">Pesos ($ COP)</option>
                    <option value="VES">Bolívares (Bs VES)</option>
                </select>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Catálogo de Productos -->
            <div class="lg:col-span-2 space-y-4">
                <h2 class="text-xl font-bold flex items-center gap-2 text-amber-400">
                    <i class="fa-solid fa-utensils"></i> Nuestro Menú
                </h2>
                <div id="catalog-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Productos renderizados dinámicamente -->
                </div>
            </div>

            <!-- Carrito de Compras -->
            <div class="space-y-4">
                <h2 class="text-xl font-bold flex items-center gap-2 text-amber-400">
                    <i class="fa-solid fa-cart-shopping"></i> Tu Pedido
                </h2>
                <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-5 shadow-2xl space-y-4 sticky top-6">
                    <div id="cart-items" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                        <!-- Items del carrito -->
                    </div>

                    <div class="border-t border-gray-800 pt-4 space-y-3">
                        <div class="flex justify-between items-center text-gray-400 text-sm">
                            <span>Total estimado:</span>
                            <span id="cart-total" class="text-2xl font-black text-emerald-400">$0.00</span>
                        </div>

                        <div class="space-y-2">
                            <label class="text-xs text-gray-400 font-semibold uppercase">Notas o Mesa del cliente:</label>
                            <input type="text" id="client-info" placeholder="Ej: Mesa 4 / Para llevar" class="w-full bg-gray-800 text-sm border border-gray-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                        </div>

                        <button onclick="sendOrderToAPI()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-gray-950 font-black py-3 rounded-xl shadow-lg transition duration-200 transform hover:scale-[1.02] flex items-center justify-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> Confirmar y Enviar Pedido
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultMenu = [
            { id: 1, name: "Hamburguesa Doble Carne", price: 8.50, category: "Comidas", stock: 25 },
            { id: 2, name: "Pizza Pepperoni Especial", price: 12.00, category: "Comidas", stock: 15 },
            { id: 3, name: "Papas Fritas Gourmet", price: 3.50, category: "Comidas", stock: 30 },
            { id: 4, name: "Refresco Cola 500ml", price: 1.50, category: "Bebidas", stock: 50 }
        ];

        let inventory = [];
        let cart = [];
        let currentCurrency = 'USD';
        const rates = { USD: 1, COP: 4100, VES: 36.5 };

        // Canal de transmisión para sincronización en vivo
        const apiChannel = new BroadcastChannel('restaurante_api_channel');

        function loadInventory() {
            const stored = localStorage.getItem('rest_inventory');
            inventory = stored ? JSON.parse(stored) : defaultMenu;
            renderCatalog();
        }

        function formatPrice(usdPrice) {
            if (currentCurrency === 'COP') return `$${(usdPrice * rates.COP).toLocaleString()} COP`;
            if (currentCurrency === 'VES') return `Bs ${(usdPrice * rates.VES).toFixed(2)}`;
            return `$${usdPrice.toFixed(2)} USD`;
        }

        function changeCurrency() {
            currentCurrency = document.getElementById('currency-select').value;
            renderCatalog();
            renderCart();
        }

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = inventory.map(item => `
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex flex-col justify-between hover:border-gray-700 transition">
                    <div>
                        <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-gray-800 text-amber-400 border border-amber-500/20">${item.category}</span>
                        <h3 class="font-bold text-lg mt-2 text-white">${item.name}</h3>
                        <p class="text-emerald-400 font-extrabold text-lg mt-1">${formatPrice(item.price)}</p>
                        <p class="text-xs text-gray-400 mt-1">Disponibles: ${item.stock}</p>
                    </div>
                    <button onclick="addToCart(${item.id})" class="mt-4 w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 font-bold py-2 rounded-xl border border-amber-500/30 transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-cart-plus"></i> Agregar
                    </button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = inventory.find(p => p.id === id);
            if (!item || item.stock <= 0) return alert('Producto agotado');

            const cartItem = cart.find(c => c.id === id);
            if (cartItem) {
                cartItem.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">Tu carrito está vacío</p>';
                document.getElementById('cart-total').innerText = formatPrice(0);
                return;
            }

            let totalUSD = 0;
            container.innerHTML = cart.map(item => {
                totalUSD += item.price * item.qty;
                return `
                    <div class="flex justify-between items-center bg-gray-800/50 p-2.5 rounded-xl border border-gray-700/50">
                        <div>
                            <p class="font-semibold text-sm text-white">${item.name}</p>
                            <p class="text-xs text-emerald-400 font-bold">${formatPrice(item.price)} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-gray-700 text-white rounded-lg flex items-center justify-center text-xs font-bold">-</button>
                            <span class="text-xs font-bold px-1">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-gray-700 text-white rounded-lg flex items-center justify-center text-xs font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-total').innerText = formatPrice(totalUSD);
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(c => c.id !== id);
            }
            renderCart();
        }

        function sendOrderToAPI() {
            if (cart.length === 0) return alert('El carrito está vacío');
            
            const info = document.getElementById('client-info').value.trim() || 'Cliente General';
            const totalUSD = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            const newOrder = {
                id: Date.now(),
                client: info,
                currency: currentCurrency,
                items: [...cart],
                total: totalUSD,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                status: 'Pendiente'
            };

            // 1. Enviar por canal en vivo
            apiChannel.postMessage({ type: 'NEW_ORDER', payload: newOrder });

            // 2. Guardar en localStorage sincronizado
            let currentOrders = JSON.parse(localStorage.getItem('rest_orders')) || [];
            currentOrders.push(newOrder);
            localStorage.setItem('rest_orders', JSON.stringify(currentOrders));

            // 3. Disparador de evento para otras pestañas
            localStorage.setItem('rest_last_order_trigger', JSON.stringify({ timestamp: Date.now() }));

            alert('¡Pedido enviado con éxito a la caja!');
            cart = [];
            document.getElementById('client-info').value = '';
            renderCart();
        }

        // Escuchar si el Admin actualiza inventarios
        apiChannel.onmessage = (event) => {
            if (event.data.type === 'INVENTORY_UPDATED') {
                inventory = event.data.payload;
                renderCatalog();
            }
        };

        // Escuchar cambios de localStorage en otras pestañas
        window.addEventListener('storage', (e) => {
            if (e.key === 'rest_inventory') {
                loadInventory();
            }
        });

        loadInventory();
    </script>
</body>
</html>
